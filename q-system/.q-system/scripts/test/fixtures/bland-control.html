<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Bland control</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f6f6f6;color:#14161a;font-family:'Public Sans',Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45}
.wrap{max-width:660px;margin:0 auto;padding:0 24px}
.screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
h1{font-size:84px;font-weight:450;letter-spacing:-0.045em;line-height:1.02;background-image:none}
.chrome{font-size:15px;color:#5d6470;margin-bottom:26px}
.say{font-size:16px;max-width:52ch;margin-top:26px}
.who{font-size:16px;color:#5d6470;max-width:52ch;margin-top:14px}
button{display:inline-block;font-family:inherit;font-size:16px;border:1px solid #14161a;
  border-radius:6px;padding:11px 18px;background:transparent;box-shadow:none;margin-top:26px;
  transition:background-color .18s ease}
button:hover{background:#14161a;color:#f6f6f6}
button:focus-visible{outline:2px solid #0066b3;outline-offset:3px}
</style></head>
<body><div class="wrap"><main class="screen">
<p class="chrome">One client, one read-only week</p>
<h1>Work leaks.<br>We find it.</h1>
<p class="say">Somebody retypes what arrives, and things fall through where they hand off.</p>
<p class="who">That was my job at VMware, LinkedIn, Google, Meta, ElevenLabs.</p>
<p><button type="button">See what the week looks at</button></p>
</main></div></body></html>
