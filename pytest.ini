[pytest]
# CODEX'S REVIEWS COULD NOT RUN THE TESTS. PR #296 round 4, 2026-09-03: the
# reviewer's own `pytest -q ...` exited 1 in 243ms with a traceback ending in
# `_pytest/capture.py:170 capman.start_global_capturing()`. Not one test ran, so
# that review's findings came from READING the diff alone -- and nothing in the
# output said so. A reviewer that silently loses its ability to execute is worse
# than one that fails loudly: its verdict still arrives looking complete.
#
# `--capture=fd` (pytest's default) dups the real file descriptors 1 and 2. In a
# sandboxed exec with no usable fds that dup raises before collection. `sys`
# capture replaces sys.stdout/sys.stderr at the Python level instead and needs no
# fd, so it cannot fail that way. Verified no test in this repo uses the `capfd`
# fixture, which is the only thing that needs fd-level capture; `capsys` is
# unaffected. Same failure family as the `stdin=DEVNULL` rule in morning-brief.py.
addopts = --capture=sys
# ASK-634. `q-system/.q-system/` is a HIDDEN directory, and pytest's DEFAULT
# norecursedirs contains `.*`, so every directory-based invocation collected
# ZERO tests from it. Measured 2026-08-10 before this file existed:
#
#   python3 -m pytest -q --collect-only          ->  822 tests, none from q-system
#   python3 -m pytest <explicit separation path> ->  168 tests
#
# 168 tests -- every containment gate and the propagation-leak model -- ran only
# when somebody typed the full path. That is how four of them stayed red since
# 1a5d0c3 with nobody deciding the reds were acceptable, and it is why four
# commits went into making a suite green that the default command still could
# not see.
#
# WHY norecursedirs AND NOT testpaths. `testpaths` would have worked for the
# suite in question and quietly broken the rest: it RESTRICTS a bare run to the
# listed paths, so the day someone adds a new top-level test directory it is
# excluded by default. That is this exact bug wearing a different hat. Overriding
# norecursedirs only ADDS reach; nothing that is collected today stops being
# collected.
#
# A gate someone has to remember to invoke is not a gate. This repo has 671 open
# spillover notes demonstrating that nobody remembers.
#
# The list below is pytest's default MINUS the blanket `.*`, PLUS every
# dot-directory that genuinely should not be walked. The scratch review copies
# (.pr39rev3, .pr42rev-r2, ...) each contain a full duplicate of the test tree,
# so failing to exclude them would triple the collection with stale copies --
# which is why they are matched by glob rather than by name.
norecursedirs =
    *.egg
    _darcs
    build
    CVS
    dist
    node_modules
    venv
    {arch}
    .git
    .venv
    .tox
    .mypy_cache
    .pytest_cache
    .ruff_cache
    .claude
    .codex
    .prd-os
    .playwright-mcp
    .fable-wt
    .sana-tmp
    .runs
    .pr*
    .review*
    template-repo
    security-remediation
