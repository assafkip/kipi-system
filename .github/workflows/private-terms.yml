# THE BACKSTOP FOR PRIVATE TERMS (ASK-2058, founder ruling 2026-10-22: "this
# repo should not have any private info").
#
# The commit-msg guard runs on a laptop that holds the private registries. It
# never sees three paths, and each one has put a client name into this repo:
#   * a squash merge, whose commit message GitHub writes from the PR title and
#     body (both client names found in 2026-08 sat in commit SUBJECTS);
#   * a commit made with --no-verify, or from a machine without the list;
#   * a hook that is not installed in the clone that made the commit.
# So this job scans the PR title, the PR body, every commit message in the
# range and every added line, against the PRIVATE_TERMS repo secret, which
# `client-name-guard.py --sync-ci-secret` refreshes from the lefthook pre-push
# stage whenever the private list changes.
#
# THE LOG IS PUBLIC. The guard's --ci mode prints the file, the line and the
# kind of term, never the term itself. Do not add a debug step that echoes the
# secret or the matched text.
#
# Fork PRs get no secrets from GitHub; the guard passes them with a notice, and
# the push to main re-runs the scan with the secret.
name: private-terms
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Full history: the scan diffs from the merge base and reads every commit
      # message in the range, and a depth-1 clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Title and body arrive through env, never interpolated into the script:
      # a PR title is attacker-controlled text on a public repo.
      - name: Scan the change for private terms
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          # A first push carries an all-zero `before`, and a force-push leaves
          # one this clone does not have. Then the base is the first parent:
          # main squash-merges, so HEAD^ is main one merge ago.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "base '${base}' is not a commit in this clone; scanning HEAD^..HEAD"
            base="HEAD^"
          fi
          python3 q-system/.q-system/scripts/client-name-guard.py --ci --base "$base" --head HEAD
