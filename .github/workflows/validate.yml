name: Skeleton Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # test-updater-issue-sequence.py proves the issue order from commit
          # ancestry against the REAL repo ("a closure commit unreachable from
          # HEAD is rejected"). The default depth-1 shallow clone carries no
          # history to probe, so every ancestry check reads as unreachable.
          fetch-depth: 0

      # kipi-update.sh commits the sync it is being tested on (guarded_commit,
      # kipi-update.sh:705) and passes no identity of its own. The ubuntu runner
      # user has an empty gecos field, so git cannot guess a name and refuses:
      # `fatal: empty ident name`. That aborts the instance at kipi-update.sh:1289
      # via `abandon_instance ... && continue`, which is UPSTREAM of the plugins
      # rsync at line 1393 -- so one missing identity failed 4 updater tests whose
      # reported symptoms (stale .venv, unsynced tracked file) look unrelated to
      # git. Diagnosed 2026-07-26 from run 30219138594; local macOS cannot
      # reproduce because its git guesses an identity from the passwd gecos field.
      - name: Configure git identity for the updater tests
        run: |
          git config --global user.name "kipi-ci"
          git config --global user.email "ci@kipi.invalid"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # pytest must exist BEFORE the gate: declared tests import it, and the
      # gate runs the full suite (first CI execution failed on step order,
      # 2026-07-23).
      - name: Install test dependencies
        run: pip install pytest

      # The capability gate replaces the old hardcoded 4-test loop: it
      # discovers every test artifact by convention, diffs declared-vs-actual
      # BOTH directions, and runs the full declared suite. The hardcoded loop
      # ran 4 of 41 declared artifacts — 90.2% never executed anywhere
      # (prd-silent-absence-capability-gate-2026-07-23).
      - name: Capability gate (declared-vs-actual + full test suite)
        run: python3 q-system/.q-system/scripts/capability-gate.py --repo-root .
        env:
          CI: true

      # CAPABILITY_GATE_SKIP: the gate just ran as its own step above; running
      # it again inside validate-separation would execute the suite twice per
      # CI run (finding-15). The skip is honored only with caller proof
      # (GITHUB_ACTIONS here).
      - name: Run skeleton validation (Phase 1)
        run: python3 validate-separation.py 1 --verbose
        env:
          CI: true
          CAPABILITY_GATE_SKIP: "1"

      - name: Run prd-os tests
        run: pytest plugins/prd-os/tests/ -q
        env:
          CI: true

      - name: Plugin version-bump guard (PR only)
        if: github.event_name == 'pull_request'
        run: |
          # NOT --depth=1: that writes .git/shallow even into an already-complete
          # clone, which silently undoes the `fetch-depth: 0` above and re-breaks
          # the `merge-base --is-ancestor` probe in test-updater-issue-sequence.py.
          # Today only step ORDER keeps that from firing (the capability gate runs
          # earlier), and nothing encodes that dependency -- a reordering would
          # quietly restore the original bug. History is already local, so there is
          # nothing to shorten. Found by adversarial review 2026-07-26.
          git fetch origin main || true
          python3 q-system/.q-system/scripts/plugin-version-bump-check.py --against origin/main
        env:
          CI: true

      # ASK-210. linear-worker.sh stops the agent at "open a PR, do not merge --
      # closeout runs through /issue-verify and /issue-closeout", and nothing
      # invoked that closeout: on 2026-07-27 seven agent PRs merged with ZERO
      # entries in .prd-os/receipts.jsonl. This step makes the absence fatal.
      #
      # --branch, not --pr: github.head_ref is already the head branch, so the
      # gate needs neither gh nor a token. Only sana/ask-<n> branches are gated;
      # human and chore PRs pass with an explicit "not gated" line.
      - name: Receipt gate (PR only)
        if: github.event_name == 'pull_request'
        run: |
          python3 q-system/.q-system/scripts/pr-receipt-gate.py \
            --branch "${{ github.head_ref }}"
        env:
          CI: true

      - name: Check for protected file changes
        if: github.event_name == 'pull_request'
        run: |
          PROTECTED=(
            "q-system/CLAUDE.md"
            "q-system/.q-system/token-guard.py"
            "q-system/.q-system/agent-pipeline/agents/step-orchestrator.md"
            "q-system/.q-system/agent-pipeline/BUS-PROTOCOL.md"
            "validate-separation.py"
            ".claude/settings.json"
            "settings-template.json"
            "kipi"
          )

          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only 2>/dev/null || git diff --name-only origin/main...HEAD)
          FLAGGED=()

          for pf in "${PROTECTED[@]}"; do
            if echo "$CHANGED" | grep -q "^${pf}$"; then
              FLAGGED+=("$pf")
            fi
          done

          if [ ${#FLAGGED[@]} -gt 0 ]; then
            echo "::warning::Protected files modified: ${FLAGGED[*]}"
            echo "## Protected Files Modified" >> $GITHUB_STEP_SUMMARY
            for f in "${FLAGGED[@]}"; do
              echo "- \`$f\`" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "These files affect all instances. Review carefully." >> $GITHUB_STEP_SUMMARY
          fi
        env:
          GH_TOKEN: ${{ github.token }}
