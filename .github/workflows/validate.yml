name: Skeleton Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # test-updater-issue-sequence.py proves the issue order from commit
          # ancestry against the REAL repo ("a closure commit unreachable from
          # HEAD is rejected"). The default depth-1 shallow clone carries no
          # history to probe, so every ancestry check reads as unreachable.
          fetch-depth: 0

      # kipi-update.sh commits the sync it is being tested on (guarded_commit,
      # kipi-update.sh:705) and passes no identity of its own. The ubuntu runner
      # user has an empty gecos field, so git cannot guess a name and refuses:
      # `fatal: empty ident name`. That aborts the instance at kipi-update.sh:1289
      # via `abandon_instance ... && continue`, which is UPSTREAM of the plugins
      # rsync at line 1393 -- so one missing identity failed 4 updater tests whose
      # reported symptoms (stale .venv, unsynced tracked file) look unrelated to
      # git. Diagnosed 2026-07-26 from run 30219138594; local macOS cannot
      # reproduce because its git guesses an identity from the passwd gecos field.
      - name: Configure git identity for the updater tests
        run: |
          git config --global user.name "kipi-ci"
          git config --global user.email "ci@kipi.invalid"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # pytest must exist BEFORE the gate: declared tests import it (first CI
      # execution failed on step order, 2026-07-23).
      - name: Install test dependencies
        run: pip install pytest

      # dc-25: without a browser every design-chain test calls skipTest, the file exits 0 and the
      # capability gate reports green. test_9 sat red that way since dc-05. A browser here plus
      # DC_REQUIRE_REAL_PRODUCERS below turns a skip into a failure.
      - name: Install a browser for the design-chain producers
        run: pip install playwright pillow && python -m playwright install --with-deps chromium

      # The capability gate replaces the old hardcoded 4-test loop: it
      # discovers every test artifact by convention, diffs declared-vs-actual
      # BOTH directions, and runs the declared tests. The hardcoded loop ran 4 of
      # 41 declared artifacts, 90.2% never executed anywhere
      # (prd-silent-absence-capability-gate-2026-07-23).
      #
      # THIS JOB IS RED ONLY FOR WHAT THE CHANGE INTRODUCED (ASK-3828, RCA
      # 2026-11-06 root cause #6). A required check that reads the whole tree goes
      # red on every PR the day main carries a finding, and no PR author can turn
      # it green, so the PR waits for a human or the floor gets bypassed. Every
      # check below is scoped to the diff against $base:
      #   * covers-lint: only the declarations the change touched.
      #   * the gate's tests: the set the diff earns (ASK-1749 for PRs; pushes
      #     since 2026-09-30, ASK-2316). change-size.py falls back to the FULL
      #     suite on anything it cannot vouch for: a change to the gate, the
      #     classifier, either selector, a pytest config or conftest, a dependency
      #     manifest, a capability declaration, a new third-party import, or any
      #     error reading the diff. A WIDE selection is not a fallback (ASK-2388).
      #   * the gate's structure checks (declared-vs-actual, required data, inert
      #     engines, the manifest): a finding $base already has is printed as a
      #     note, never failed. A finding the change adds still fails it, which is
      #     why PR #600's own undeclared test stays red here.
      # The unscoped versions, plus validate-separation phase 1 (a whole-skeleton
      # sweep with no diff mode), run nightly in gates.yml on main. A red there
      # files one issue against the commit that broke it (gates-red-filer.py).
      # test_ci_workflows.py fails if a tree-wide gate comes back to this job.
      #
      # covers-lint runs FIRST, inside this step (ASK-1918): a wrong `covers`
      # declaration makes the gate select fewer tests, so the check on the
      # declarations cannot be downstream of the thing they steer. The empty-list
      # guard is load-bearing: covers-lint with no path sweeps every fragment.
      #
      # THE BASE. On a PR it is origin/<target>. On a push, `github.event.before`
      # is main as it stood before this push, so the diff is exactly what the
      # push landed. That sha is unusable on a branch's first push (all zeros)
      # and after a force-push (the old tip is gone from the clone); then the base
      # is HEAD^, the first parent, which is main one merge ago because main
      # squash-merges. A base that still does not resolve stops the step red: the
      # scoping above has nothing to scope against, and guessing would be silent.
      # The checkout above uses fetch-depth 0, so origin/<base> and `before`
      # resolve.
      - name: Capability gate (the declarations, structure and tests this change earns)
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
          else
            base="$PUSH_BEFORE"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "push base '${base}' is not a commit in this clone; diffing against HEAD^"
              base="HEAD^"
            fi
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::diff base '${base}' is not a commit in this clone"
            exit 1
          fi
          echo "capability gate diff base: ${base}"
          frags="$(git diff --name-only --diff-filter=d "$base" -- q-system/.q-system/capability/expected_tests/)"
          if [ -n "$frags" ]; then
            python3 q-system/.q-system/scripts/covers-lint.py --repo-root . $frags
          else
            echo "covers-lint: no coverage declaration changed against ${base}"
          fi
          python3 q-system/.q-system/scripts/capability-gate.py --repo-root . --diff-base "$base"
        env:
          CI: true
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          # dc-25: a design-chain test with no browser SKIPS and the file exits 0, so the gate read
          # green over tests that never ran. With this set they fail instead.
          DC_REQUIRE_REAL_PRODUCERS: "1"

      # NO UNSCOPED prd-os STEP (RULE-2026-10-01-A). One stood here and ran all of
      # plugins/prd-os/tests on every PR and push, whatever the change touched.
      # plugins/prd-os is a declared suite in .verify-suites, so verify.yml grades
      # it scoped to what a change owns, and the nightly gates.yml runs it in full.
      # test_ci_workflows.py fails if a whole-directory pytest comes back here.

      # The skeleton's own harnesses had NO runner (adversarial review finding-5):
      # test_auto_commit, test_token_guard and test_fable_escalation all sat unrun,
      # so "a test locks the property" was an unenforced claim. wiring-check.md is
      # explicit that a Python harness needs a caller.
      - name: Run skeleton hook tests
        # SCOPED TO THIS FILE deliberately. The sibling harnesses in that directory
        # were unrun for a reason: separation/ has 6 failures predating this branch,
        # and test_token_guard.py passes locally but fails 11 in CI (it depends on
        # git identity and /tmp state the runner does not provide). Widening the gate
        # onto either is how CI starts paging the founder for a bug this PR did not
        # cause. Both are tracked; unignore them as they are fixed.
        run: pytest q-system/.q-system/tests/test_auto_commit.py -q
        env:
          CI: true

      # STAYS ON THE PR (ASK-3828): already diff-scoped. It diffs against the
      # merge-base of base.sha and HEAD, so it can only name a plugin this PR
      # changed. Checked 2026-11-06 on #530, #529 and #528: every plugin it
      # named was one that PR's own diff touched.
      - name: Plugin version-bump guard (PR only)
        if: github.event_name == 'pull_request'
        run: |
          # The base is GitHub's OWN base sha for this PR, not a fetched ref
          # (ASK-514). `git fetch origin main || true` swallowed its failure and
          # left origin/main STALE BUT RESOLVABLE, which is the dangerous shape:
          # the gate's fail-closed guard never fires because the ref resolves,
          # and version_at(stale base) then reads a HISTORICAL bump that makes
          # the PR's own unbumped plugin look bumped. Measured on a scratch repo:
          #     --against HEAD        -> exit 2   correctly refused
          #     --against stale-main  -> exit 0   the violation was EXCUSED
          #
          # base.sha comes from the event payload, so it needs no network, always
          # resolves, and cannot go stale. `fetch-depth: 0` on the checkout above
          # is what guarantees the commit is present locally -- do not weaken it
          # to --depth=1, which writes .git/shallow even into an already-complete
          # clone and re-breaks the `merge-base --is-ancestor` probe in
          # test-updater-issue-sequence.py (adversarial review 2026-07-26).
          python3 q-system/.q-system/scripts/plugin-version-bump-check.py \
            --against "${{ github.event.pull_request.base.sha }}"
        env:
          CI: true

      - name: Check for protected file changes
        if: github.event_name == 'pull_request'
        run: |
          PROTECTED=(
            "q-system/CLAUDE.md"
            "q-system/.q-system/token-guard.py"
            "q-system/.q-system/agent-pipeline/agents/step-orchestrator.md"
            "q-system/.q-system/agent-pipeline/BUS-PROTOCOL.md"
            "validate-separation.py"
            ".claude/settings.json"
            "settings-template.json"
            "kipi"
          )

          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only 2>/dev/null || git diff --name-only origin/main...HEAD)
          FLAGGED=()

          for pf in "${PROTECTED[@]}"; do
            if echo "$CHANGED" | grep -q "^${pf}$"; then
              FLAGGED+=("$pf")
            fi
          done

          if [ ${#FLAGGED[@]} -gt 0 ]; then
            echo "::warning::Protected files modified: ${FLAGGED[*]}"
            echo "## Protected Files Modified" >> $GITHUB_STEP_SUMMARY
            for f in "${FLAGGED[@]}"; do
              echo "- \`$f\`" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "These files affect all instances. Review carefully." >> $GITHUB_STEP_SUMMARY
          fi
        env:
          GH_TOKEN: ${{ github.token }}
