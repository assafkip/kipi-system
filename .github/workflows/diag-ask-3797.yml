name: diag-ask-3797
# TEMPORARY. Diagnoses ASK-3797 on a real GitHub runner: which assertion of
# test-dispatch-stale-checkout.sh fails intermittently. Removed from the branch
# before the PR opens.
on:
  push:
    branches: [sana/ask-3797-stale-checkout-flake]

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          git config --global user.name "kipi-ci"
          git config --global user.email "ci@kipi.invalid"
      - name: Case 11 alone, traced
        run: bash .github/diag-ask-3797-race.sh kipi-dispatch.sh 400; nproc; df -T /tmp; uname -r; bash --version | head -1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loop-${{ matrix.shard }}
          path: out/
