name: diag-ask-3797
# TEMPORARY. Diagnoses ASK-3797 on a real GitHub runner: which assertion of
# test-dispatch-stale-checkout.sh fails intermittently. Removed from the branch
# before the PR opens.
on:
  push:
    branches: [sana/ask-3797-stale-checkout-flake]

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          git config --global user.name "kipi-ci"
          git config --global user.email "ci@kipi.invalid"
      - name: Loop the test, keep every failing run
        run: bash .github/diag-ask-3797-loop.sh 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loop-${{ matrix.shard }}
          path: out/

  fullgate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          git config --global user.name "kipi-ci"
          git config --global user.email "ci@kipi.invalid"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - name: Capability gate, full suite (prints FAIL lines above the tail)
        run: python3 q-system/.q-system/scripts/capability-gate.py --repo-root .
        env:
          CI: true
          DC_REQUIRE_REAL_PRODUCERS: "1"
