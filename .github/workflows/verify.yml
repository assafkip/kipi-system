# GATE 2 OF 2 in this repo (pre-commit is the other). The same verify.sh, so the
# commit door and the merge door cannot quietly diverge.
#
# Added with the lefthook wiring 2026-08-27, after Codex review of PR #259 filed
# a major: the script shipped here with no caller in any tracked hook or
# workflow, so merging it added zero enforcement. The finding was correct.
name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # THE SAME MISSING IDENTITY validate.yml carries a scar for, in the other
      # door. verify.sh runs q-system/hooks/test/test_auto_commit_run_marker.py,
      # whose subject is a SUBPROCESS: run_hook spawns auto-commit.py, which runs
      # its own `git commit`, and that child inherits the runner's identity, not
      # the `git -c user.email=...` the test passes to its own commands. The
      # ubuntu runner user has an empty gecos field so git cannot guess one and
      # refuses with "Author identity unknown"; the failure then reads "the hook
      # did not commit", as if the hook were broken. Measured 2026-09-07 from run
      # 34123764623, the first run after that suite was named in .verify-suites.
      # macOS cannot reproduce it -- its git guesses from the passwd gecos field,
      # which is the same reason validate.yml's copy of this note exists.
      #
      # The test was ALSO made hermetic in the same change (it writes the
      # identity into its own temp repo), so this step is the second of two
      # independent fixes, not the only one holding it up.
      - name: Configure git identity for tests that spawn git
        run: |
          git config --global user.name "kipi-ci"
          git config --global user.email "ci@kipi.invalid"

      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, not the default depth-1 shallow clone.
          #
          # why (measured 2026-08-27): the first CI run of this workflow failed
          # 18 tests that are green locally. Seven of them reproduce EXACTLY in a
          # real shallow clone:
          #   git clone --depth 1 ... && pytest q-system/.q-system/tests
          #   -> 7 failed, 446 passed
          # They are separation tests that run `git show <sha>:<path>` against
          # commits that a depth-1 checkout does not have, so git exits 128 and
          # the test reports a defect that is really a missing object.
          #
          # This is declaring the environment the suite needs, not loosening the
          # gate: with full history those tests grade the same thing they grade
          # on a developer machine.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # From the fleet's verify requirements (pytest + pytest-xdist), so the
      # adversarial suite's parallel and .verify-serial cases run for real here
      # instead of taking their no-xdist branch (2026-10-05).
      - run: pip install -r q-system/.q-system/requirements-verify.txt
      # SCOPED, NOT --full (RULE-2026-10-01-A, founder bar 2026-10-01: "no
      # 6000-test runs on small changes"). This step ran `verify.sh --full` on
      # every PR and every push to main: 12.5 min on run 36820282302, the same
      # suite validate.yml had just graded. --changed runs the suites a change
      # touches and, inside each, the tests verify_select.py says own it; a path
      # no test names takes the suite's declared fallback or that whole suite,
      # never nothing. The full suite runs only in the nightly gates.yml, and
      # test_ci_workflows.py fails if any other workflow can run it.
      #
      # THE BASE, EXPLICIT. Without --base, --changed diffs against the merge-base
      # with origin's default branch. On a push to main HEAD IS that branch, so the
      # diff is empty and the step would pass having graded nothing. A push diffs
      # against `before` (main as it was), or HEAD^ when that commit is not in
      # the clone (a first push, a force-push); same rule as validate.yml.
      - name: verify.sh --changed (the suites and tests this change owns)
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
          else
            base="$PUSH_BEFORE"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "push base '${base}' is not a commit in this clone; diffing against HEAD^"
              base="HEAD^"
            fi
          fi
          echo "verify diff base: ${base}"
          bash q-system/.q-system/verify.sh --changed --base "$base"
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
      # THE HARNESS THAT GUARDS THE GATE NEEDS A CALLER TOO.
      #
      # codex, PR #259 round 5, minor: 15 adversarial cases asserting verify.sh's
      # exit codes existed and NOTHING RAN THEM, so they provided zero regression
      # protection. That is the same finding as the round-1 major one layer up --
      # I wired the floor and left its own test suite unwired. A check nobody
      # invokes is an aspiration, whichever layer it sits on.
      - name: adversarial suite (the floor's own tests)
        run: bash q-system/.q-system/test_verify_adversarial.sh q-system/.q-system/verify.sh
      # ASK-1900. The concurrency half, wired in the SAME commit that adds it --
      # its sibling above shipped unwired and a Codex review had to find that.
      # Neither suite is visible to the capability gate: TEST_PATTERNS carries
      # test-*.sh and not test_*.sh, so a file named like these two is discovered
      # by nothing. This caller is the only thing that runs it.
      - name: concurrent suite (collision is not a failed check)
        run: bash q-system/.q-system/test_verify_concurrent.sh q-system/.q-system/verify.sh
      # The push door (--changed, 2026-09-30), wired in the SAME commit for the
      # same reason as the two above: discovered by nothing else.
      - name: changed suite (push runs only the owning tests, never nothing)
        run: bash q-system/.q-system/test_verify_changed.sh q-system/.q-system/verify.sh
